# Two-gNB live evaluation config (M28 prep, docs/PAPER5_M27_M28_scope.md).
# Dimension-matched to saclb_offline_live2gnb.yaml (state_dim=19,
# request_state_dim=24) for a genuine multi-gNB (GAT-CTDE) live demo,
# NOT the single-agent dqn/a2c/rainbow/lb_only path saclb_xapp.py serves
# (that frozen script hard-requires len(cfg.gnbs)==1) -- see the new
# m28_live_gat_ctde_2gnb.py orchestration script.
#
# gNB2's E2 agent ports: RESOLVED. M26's original nr-softmodem-gnb2
# build only had E2AGENT_IN_PORT confirmed patched (6655->6656);
# whether E2AGENT_OUT_PORT was also changed (needed so gNB2's
# INDICATION_RESPONSE doesn't collide with gNB1's own response port
# 6600) was not recoverable from this session's git history or the
# compiled binary. Rebuilt nr-softmodem-gnb2 fresh, this session, with
# BOTH ports deliberately set (E2AGENT_IN_PORT=6656,
# E2AGENT_OUT_PORT=6601), verified different from gNB1's own binary
# (cmp: differ at byte 889, the embedded port constant) and gNB1's own
# binary verified byte-identical to its known-good reference copy
# afterward (source reverted, confirmed via git diff before rebuilding
# gNB1 again) -- no live hardware touched, compile-only. The old,
# ambiguous-port nr-softmodem-gnb2 binary was removed, superseded by
# this one. gnb-1 below uses these now-confirmed ports (6656 in / 6601
# out), not a guess.
#
# 2026-07-14 fresh-rig retune (this checkout's ORANSlice main + docker_open5gs
# open5gs_slicing core ship TWO real S-NSSAIs, not three -- verified by
# reading the AMF/gNB config directly, not assumed; see BRINGUP_LOG.md Stage
# 4 finding). Dropped the "urllc" slice entry (sd=1) at that time: no MAC
# slice with that (sst,sd) existed on this gNB yet, so
# apply_slicing_ctrl() (e2_message_handlers.c) would have silently no-op'd
# for any CONTROL targeting it every step -- a permanent no-op ceiling
# can't "bind" on real hardware, it would just be misleading in the omega
# log.
#
# 2026-08-19 (M8 live anchor): re-added below. The core/gNB gap above is
# closed -- BRINGUP_LOG.md's "Post-Stage-10 addendum" added a real 3rd
# S-NSSAI (sst=1/sd=1) to both the core (dedicated smf-slice3/upf-slice3)
# and the gNB's snssaiList, and this session verified it live: UE3 attached
# on it (192.168.102.2, 0% packet loss to 8.8.8.8) with real traffic
# flowing. `saclb_offline_live1gnb.yaml` (the matching offline training
# config for this single-gNB topology) already carries a 3-slice roster
# including urllc and always has -- this file was the one left stale, not
# that one. Re-adding urllc here is required for state_dim compatibility:
# a checkpoint trained against 3 slices will not load against a 2-slice
# eval config (the exact class of bug this file's own gNB-count header
# already documents, here on the slice-count axis instead). Parameters
# below are copied from saclb_offline_live1gnb.yaml's urllc entry, not
# independently re-verified against live demand: this rig's own E2 probe
# (30 polls, real 300Kbps urllc traffic on UE3) showed avg_prbs_dl flat at
# the same 5.00 PRB idle floor mmtc also shows, too coarse a signal at this
# traffic rate to calibrate a cap from directly, though
# dl_mac_buffer_occupation did show real backlog (40.0% vs. mmtc's 3.3%),
# confirming genuine contention exists even where avg_prbs_dl does not
# discriminate it. Flagged unverified rather than silently presented as
# measured, the same honesty standard mmtc's own cap below already applies.
#
# paper_variant: paper2 is set only to keep the mmtc slice available; the
# LB term is a no-op here regardless (fairness_ratio is trivially 1.0 with
# one gNB) -- see SINGLE_GNB_LIVE_LIMITATION in xapp/saclb_xapp.py.
name: saclb_live
random_seed: 256
paper_variant: paper2
B: 100
# Lmax scaled down to match the tiny PRB quotas below (was 100, calibrated
# for the original 30-90 ratio range): with a 1-2 PRB/step deficit, a
# Lmax of 100 would take ~100 steps to ever trip queue_len_norm>1.0 and
# the reward's violation penalty -- far longer than any of these live
# runs -- silently making "accept everything" costless regardless of
# actual backlog. 10 lets a few steps of real deficit matter.
Lmax: 10

gnbs:
  - gnb_id: gnb-0
    prb_capacity: 100
  - gnb_id: gnb-1
    prb_capacity: 100

# Ratio bounds deliberately tight relative to observed real demand.
# RECALIBRATED 2026-07-14 against THIS rig's own live measurement (not
# copied from the old rig's numbers, though they turned out close): Stage 7
# probe (qoe_oran_framework/scripts/probe_e2_preconditions.py, 120 polls,
# single UE on the embb slice, light ping traffic) measured avg_prbs_dl
# mean=5.17 PRB, max=12.00 PRB (out of B=100, i.e. ~106 real PRBs at
# 106-PRB/numerology-1). The *original* bounds here (nominal 30/60/10, cap
# 60/90/40) left 10-20x headroom above that scale, so every policy
# (heuristic or learned) could always accept without ever hitting a real
# ceiling: zero blocks, no differentiation. Old rig's own retune (cap
# 4/4/3) already landed close to this rig's measured scale by coincidence
# (its ~5.0 PRB/UE reference vs. this rig's 5.17 mean/12 max) -- kept those
# cap values as still-valid (mean sits just under embb's cap=4, and even
# the max=12 burst sits comfortably below what a cap around this scale
# would allow through, so ceiling enforcement remains meaningful, not
# vacuous). mmtc's cap (3) has NOT been re-verified against a live
# measurement on this rig (Stage 8 curtailed multi-UE scale-out -- this
# machine started swapping with just the one required UE attached, see
# BRINGUP_LOG.md Stage 8) -- left at the old rig's reference value, flagged
# here as unverified rather than silently presented as measured.
#
# embb: sd corrected 0 -> 16777215 (0xFFFFFF). The old rig's "sd: 0" was
# wrong for a real OAI slice on THIS checkout: 0xFFFFFF is the actual wire
# value for "no SD configured" (3GPP's SD-absent sentinel), confirmed both
# by this gNB's own MAC slice-init log ("Slice id = 1 [ sst = 1, sd = ffffff ]")
# and by the Stage 7 probe's live P2/P4 output ("sst1/sd16777215"). Sending
# CONTROL with sd=0 would target sst=1/sd=0 -- a slice that doesn't exist on
# this gNB (id0's sst=0/sd=0 is the reserved SRB-only default slice, a
# DIFFERENT sst) -- so every ceiling command for "embb" would have silently
# no-opped against real hardware while this value was wrong. This is
# load-bearing, not cosmetic: env.py sends slicing_control_m using this
# exact (sst, sd) pair (env.py:183) each step.
#
# Slice list order matches saclb_offline_live1gnb.yaml's (urllc, embb,
# mmtc) exactly, not just its slice SET -- config.py's slice_by_id is a
# plain {s.slice_id: s for s in self.slices} dict comprehension, so it
# preserves YAML insertion order. If any state-construction code iterates
# this dict to build a per-slice feature vector, a mismatched order here
# would silently swap which slice's features land in which input
# position for a checkpoint trained under the other file's order --
# same values, wrong meaning. Kept identical order to remove that risk
# entirely rather than rely on an assumption about the iteration order
# not mattering.
# 2026-08-28 (M28 24-PRB retry, ratio rescale): the ratio values below are
# percentages (0-100), NOT absolute PRB counts -- confirmed by reading
# apply_slicing_ctrl() (openair2/E2_AGENT/e2_message_handlers.c) and its
# consumer in gNB_scheduler_dlsch.c:
#   SL_sched[i].max_prbs = (n_rb_sched_init * SL_i->spolicy.max_ratio) / 100;
# (C integer division, truncates toward zero). The values that shipped here
# before this edit (nominal/floor/cap in the 1-4 range) were calibrated
# against the ORIGINAL 106-PRB physical channel, where "1 ratio-unit ~= 1
# real PRB" by near-coincidence (comments below still describe real-PRB
# targets in those terms). When the physical RAN was scaled down to 24 PRBs
# for the M28 live-stability retry (docs/PAPER5_M27_M28_scope.md), those same
# percentages were NOT rescaled, and with n_rb_sched_init<=24,
# (24 * ratio)/100 == 0 for every ratio value this run ever actually
# commanded (checked directly against the run's own omega log: urllc=3,
# embb=3-4, mmtc=1-2 -- all truncate to 0 PRBs). Every slice was getting
# ZERO scheduler PRBs for the entire run, on both gNBs, which is what
# produced mmtc's 100% block rate (unschedulable, not an admission-policy
# choice) and eMBB's runaway RLC "max RETX reached on DRB 1" storm (500Kbps
# of real traffic funneled through a zero PRB grant) -- confirmed NOT a
# radio-quality issue since SNR stayed a clean 50-51dB and PHY BLER stayed
# 1-3% throughout; this was pure MAC-scheduler starvation from the ratio
# truncating to zero, unrelated to the earlier (106-PRB attempt's) CPU/
# hyperthreading root-cause finding.
#
# Rescaled below to preserve the SAME real-PRB targets the original
# 106-PRB-calibrated values intended (e.g. embb's original max_ratio_cap=4
# meant "~4 real PRBs out of ~106"), recomputed for a 24-PRB physical
# channel: new_ratio_pct = round(target_real_PRBs / 24 * 100), with floors
# bumped to 8% (not the exact-minimum 5%) for headroom against slots where
# n_rb_sched_init is transiently below 24 (SSB/CORESET overhead). This is a
# rescale for the new physical channel width, not a methodology change --
# the same real-PRB budgets as the original calibration, on a smaller cell.
slices:
  - slice_id: urllc
    sst: 1
    sd: 1
    nominal_ratio: 13  # ~3 real PRB at n=24 (24*13/100=3.12->3), matches original nominal=cap=3 real-PRB target
    min_ratio_floor: 8  # ~1 real PRB at n=24 (24*8/100=1.92->1), matches original floor=1
    max_ratio_cap: 13  # ~3 real PRB at n=24 -- copied from saclb_offline_live1gnb.yaml's real-PRB target, UNVERIFIED against live demand on this rig (avg_prbs_dl too coarse at this traffic rate to calibrate from directly; see header comment)
    latency_budget_ms: 15
    loss_budget_pct: 0.8
    priority_weight: 12.0
    accept_reward: 1.0
    violation_penalty: 10.0
  - slice_id: embb
    sst: 1
    sd: 16777215  # 0xFFFFFF, corrected from 0 -- see comment above
    nominal_ratio: 13  # ~3 real PRB at n=24, matches original nominal=3 real-PRB target
    min_ratio_floor: 8  # ~1 real PRB at n=24, matches original floor=1
    max_ratio_cap: 17  # ~4 real PRB at n=24 (24*17/100=4.08->4) -- verified below this rig's measured demand (mean 5.17, max 12.00 PRB) -- see comment above
    latency_budget_ms: 45
    loss_budget_pct: 2.0
    priority_weight: 3.5  # synced to saclb_offline_live1gnb.yaml's safety-margin weights (was 2.0)
    accept_reward: 1.0
    violation_penalty: 5.0
  - slice_id: mmtc
    sst: 1
    sd: 2
    nominal_ratio: 9  # ~2 real PRB at n=24 (24*9/100=2.16->2), matches original nominal=2 real-PRB target
    min_ratio_floor: 8  # ~1 real PRB at n=24, matches original floor=1
    max_ratio_cap: 13  # ~3 real PRB at n=24 -- UNVERIFIED against live demand on this rig -- old rig's reference value, no UE was ever attached to this slice here (Stage 8 curtailed)
    latency_budget_ms: 65
    loss_budget_pct: 3.5
    priority_weight: 0.3  # synced to saclb_offline_live1gnb.yaml's safety-margin weights (was 1.0)
    accept_reward: 1.0
    violation_penalty: 2.5

# congestion_coeff=1.5, violation_penalty raised ~5x per slice above --
# matches the same retuning applied to saclb_offline_dqn.yaml (see that
# file's comment for the full rationale and the congestion_coeff=6.0->1.5
# recalibration story). Kept identical to the offline training config so a
# checkpoint's learned value function stays meaningful against the reward
# actually reported/logged here at live-eval time.
reward:
  congestion_coeff: 1.5
  lb_coeff: 1.0

arrivals:
  synthetic_arrivals_per_step: 2
  max_pending_per_step: 8
  ceiling_step_ratio: 1

episode:
  step_seconds: 5.0
  steps_per_episode: 60

# Stage One: QoE-aware reward mode (eq.9) for the "+QoE-driven-ratio"
# ablation arm (see saclb_xapp.py's --reward-mode flag) -- the "static/
# heuristic-ratio baseline" arm uses lb_only unchanged and never reads this
# section. Kept identical to saclb_offline_live1gnb.yaml's qoe: section
# (same rationale as the reward: section above -- a checkpoint/mapper
# trained under one set of weights must be evaluated under the same set).
# iqx_coeffs are CALIBRATED and mapper_checkpoint points at the trained
# per-slice LSTMs -- see saclb_offline_live1gnb.yaml's qoe: section comment
# for the full alignment-metric evidence (calibration/fit_iqx.py,
# calibration/train_lstm.py).
qoe:
  reward:
    alpha: 1.0
    beta: 0.2
    gamma: 0.5
  lstm_hidden: 32
  window: 8
  max_staleness: 20
  mapper_checkpoint:
    urllc: qoe_oran_framework/results/qoe_mapper/qoe_mapper_urllc.pt
    embb: qoe_oran_framework/results/qoe_mapper/qoe_mapper_embb.pt
    mmtc: qoe_oran_framework/results/qoe_mapper/qoe_mapper_mmtc.pt
  iqx_coeffs:
    urllc: {alpha: 5.167748, beta: 9.999999, gamma: 44.904893, delta: 199.999999, epsilon: 0.000000}
    embb:  {alpha: 3.522951, beta: 0.425081, gamma: 0.000000, delta: 0.000000, epsilon: 199.999999}
    mmtc:  {alpha: 5.999999, beta: 9.999999, gamma: 0.000000, delta: 7.944624, epsilon: 0.000000}
